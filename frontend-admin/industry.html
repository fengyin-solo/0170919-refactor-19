<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%23111' width='32' height='32' rx='4'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='%23fff' font-family='system-ui'>知</text></svg>" />
  <title>行业知识 - 知识配置平台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
  <script src="js/tailwind-config.js"></script>
  <link href="css/common.css" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="bg-canvas text-slate-600 font-sans antialiased min-h-screen selection:bg-emerald-900 selection:text-white">
  <!-- 侧边栏与顶栏由 js/common.js 统一渲染（登录守卫、侧边栏与顶栏） -->
  <div id="app" class="flex min-h-screen">
    <main class="flex-1 flex flex-col min-w-0">
      <div class="flex-1 p-6 md:p-8 space-y-10">
        <!-- 行业管理 -->
        <section>
          <div class="flex flex-wrap items-end justify-between gap-4 mb-4">
            <h2 class="section-title tracking-tight text-slate-900">行业列表</h2>
            <button type="button" id="btnAddIndustry" class="btn-primary inline-flex items-center gap-2"><span class="iconify" data-icon="lucide:plus" data-width="16" data-height="16"></span>新增行业</button>
          </div>
          <div class="premium-card overflow-hidden rounded-xl border border-slate-100 shadow-sm">
            <div class="table-wrap">
              <table class="w-full text-sm">
                <thead>
                  <tr>
                    <th class="w-48">行业名称</th>
                    <th class="w-28">行业等级</th>
                    <th class="w-40">所属分类</th>
                    <th class="text-right w-40">操作</th>
                  </tr>
                </thead>
                <tbody id="industryTableBody"></tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- 当前行业下的知识 -->
        <section>
          <h2 class="section-title tracking-tight text-slate-900 mb-4">行业知识</h2>
          <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
            <div class="flex items-center gap-2">
              <label class="text-sm font-medium text-slate-600 whitespace-nowrap">筛选</label>
              <select id="industrySelect" class="input-common select-common w-56" title="筛选列表数据">
                <option value="">全部行业</option>
              </select>
            </div>
            <button type="button" id="btnAddKnowledge" class="btn-primary inline-flex items-center gap-2"><span class="iconify" data-icon="lucide:plus" data-width="16" data-height="16"></span>新增知识</button>
          </div>
          <div id="knowledgeEmpty" class="premium-card empty-state hidden rounded-xl border border-slate-100">暂无行业知识数据。</div>
          <div id="knowledgeBlock">
            <div class="premium-card overflow-hidden rounded-xl border border-slate-100 shadow-sm">
              <div class="table-wrap">
                <table class="w-full text-sm">
                  <thead>
                    <tr>
                      <th class="w-40">行业</th>
                      <th>标准问</th>
                      <th>相似问</th>
                      <th>答案</th>
                      <th class="text-right w-28">操作</th>
                    </tr>
                  </thead>
                  <tbody id="knowledgeTableBody"></tbody>
                </table>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- 行业编辑弹层 -->
  <div id="industryModal" class="modal-overlay" style="display: none;">
    <div class="modal-box premium-card max-w-md rounded-2xl border border-slate-200">
      <h3 id="industryModalTitle" class="modal-title text-slate-900">新增行业</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">一级行业</label>
          <select id="industryFormLevel1" class="input-common select-common">
            <option value="">请选择一级行业</option>
          </select>
          <div id="industryFormNewLevel1Wrap" class="mt-2 hidden">
            <input type="text" id="industryFormNewLevel1" class="input-common rounded-xl" placeholder="输入新一级行业名称" />
            <p class="text-xs text-slate-500 mt-1">不填二级即新增一级行业；二级留空表示仅建立一级。</p>
          </div>
        </div>
        <div id="industryFormLevel2Wrap">
          <label class="block text-sm font-medium text-slate-700 mb-1">二级行业（可选）</label>
          <select id="industryFormLevel2" class="input-common select-common" disabled>
            <option value="">请先选择一级行业</option>
          </select>
          <div id="industryFormNewLevel2Wrap" class="mt-2 hidden">
            <input type="text" id="industryFormNewLevel2" class="input-common rounded-xl" placeholder="输入新二级行业名称" />
          </div>
          <p class="text-xs text-slate-500 mt-1">留空表示当前新增的是一级行业；选择或输入二级则挂载在上方一级下。</p>
        </div>
      </div>
      <div class="flex justify-end gap-3 mt-6">
        <button type="button" id="industryModalCancel" class="btn-secondary">取消</button>
        <button type="button" id="industryModalSubmit" class="btn-primary inline-flex items-center gap-2"><span class="iconify" data-icon="lucide:check" data-width="16" data-height="16"></span>保存</button>
      </div>
    </div>
  </div>

  <!-- 知识编辑弹层 -->
  <div id="knowledgeModal" class="modal-overlay" style="display: none;">
    <div class="modal-box premium-card max-w-lg rounded-2xl border border-slate-200">
      <h3 id="knowledgeModalTitle" class="modal-title text-slate-900">新增知识</h3>
      <div class="space-y-4">
        <div id="knowledgeFormIndustryWrap">
          <label class="block text-sm font-medium text-slate-700 mb-1">选择行业</label>
          <select id="knowledgeFormIndustry" class="input-common select-common">
            <option value="">请选择要添加知识的行业</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">标准问</label>
          <input type="text" id="formStandardQ" class="input-common rounded-xl" placeholder="输入标准问题" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">相似问（多行，一行一个）</label>
          <textarea id="formSimilarQ" class="input-common min-h-[80px] rounded-xl" placeholder="每行一个相似问法"></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">答案</label>
          <textarea id="formAnswer" class="input-common min-h-[100px] rounded-xl" placeholder="输入答案内容"></textarea>
        </div>
      </div>
      <div class="flex justify-end gap-3 mt-6">
        <button type="button" id="knowledgeModalCancel" class="btn-secondary">取消</button>
        <button type="button" id="knowledgeModalSubmit" class="btn-primary inline-flex items-center gap-2"><span class="iconify" data-icon="lucide:check" data-width="16" data-height="16"></span>保存</button>
      </div>
    </div>
  </div>

  <script src="js/mock.js"></script>
  <script src="js/app.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pages/industry.js"></script>
</body>
</html>
